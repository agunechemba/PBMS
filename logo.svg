<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Background (Optional, set to transparent) -->
  <rect width="400" height="400" fill="transparent"/>

  <!-- ELEPHANT ICON (Front-Facing) -->
  <g id="elephant-icon">
    
    <!-- Outer Ears (Navy) -->
    <path d="M 180 90 
             C 90 60 40 150 80 240 
             C 110 280 160 230 180 180 Z" fill="#194C7A" />
    <path d="M 220 90 
             C 310 60 360 150 320 240 
             C 290 280 240 230 220 180 Z" fill="#194C7A" />
             
    <!-- Inner Ears (Orange Accents) -->
    <path d="M 165 115 
             C 110 100 70 160 95 215 
             C 115 240 145 200 165 165 Z" fill="#F49E1A" />
    <path d="M 235 115 
             C 290 100 330 160 305 215 
             C 285 240 255 200 235 165 Z" fill="#F49E1A" />

    <!-- Tusks (Orange) -->
    <path d="M 170 175 
             C 130 185 100 205 85 235 
             C 115 225 140 210 175 195 Z" fill="#F49E1A" />
    <path d="M 230 175 
             C 270 185 300 205 315 235 
             C 285 225 260 210 225 195 Z" fill="#F49E1A" />

    <!-- Main Head & Trunk (Navy) -->
    <path d="M 160 100 
             C 160 50 190 55 200 70 
             C 210 55 240 50 240 100 
             C 240 140 220 160 200 160 
             C 180 160 160 140 160 100 Z" fill="#194C7A" />
             
    <path d="M 180 140 
             L 172 250 
             C 172 290 190 310 200 310 
             C 210 310 228 290 228 250 
             L 220 140 
             C 210 160 190 160 180 140 Z" fill="#194C7A" />

    <!-- Trunk Wrinkles (Subtle White Lines) -->
    <path d="M 176 230 Q 200 240 224 230" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" fill="none" />
    <path d="M 174 260 Q 200 270 226 260" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" fill="none" />
    <path d="M 175 285 Q 200 295 225 285" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" fill="none" />

    <!-- Eyes (White with Navy Pupils) -->
    <circle cx="175" cy="125" r="9" fill="#FFFFFF" />
    <circle cx="175" cy="125" r="4" fill="#194C7A" />
    
    <circle cx="225" cy="125" r="9" fill="#FFFFFF" />
    <circle cx="225" cy="125" r="4" fill="#194C7A" />

  </g>

  <!-- TEXT: PBMS -->
  <text x="200" y="375" 
        font-family="'Arial Black', Impact, 'Segoe UI Black', sans-serif" 
        font-weight="900" 
        font-size="100" 
        fill="#194C7A" 
        text-anchor="middle" 
        letter-spacing="-3">
    PBMS
  </text>
</svg>